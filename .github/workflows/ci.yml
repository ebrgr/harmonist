name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checkout is all either job needs; don't inherit the repo-default token scope.
permissions:
  contents: read

jobs:
  # Native runners catch missing architecture-specific dependencies and startup
  # failures that the Python suite cannot see in the packaged image.
  container:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag harmonist:smoke .

      - name: Start demo and wait for health check
        run: |
          docker run --detach --name harmonist-smoke --env HARMONIST_DEMO_MODE=1 \
            --health-interval=2s --health-start-period=5s --health-retries=30 \
            harmonist:smoke
          trap 'docker logs harmonist-smoke; docker rm --force --volumes harmonist-smoke' EXIT
          for _ in {1..60}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' harmonist-smoke)
            if [ "$status" = healthy ]; then
              docker exec harmonist-smoke python -c '
          import pathlib, shutil, urllib.request
          base = "http://127.0.0.1:8000/static/vendor/"
          for name in ("htmx.min.js", "idiomorph-ext.min.js", "htmx.LICENSE", "idiomorph.LICENSE"):
              assert urllib.request.urlopen(base + name).read()
          assert shutil.which("node") is None
          assert not pathlib.Path("/app/node_modules").exists()
          '
              exit 0
            fi
            if [ "$status" = unhealthy ] || [ "$(docker inspect --format '{{.State.Running}}' harmonist-smoke)" != true ]; then
              exit 1
            fi
            sleep 2
          done
          echo "::error::Demo container did not become healthy within 120 seconds."
          exit 1

  # Lint + type-check + tests, mirroring `make check`, across supported Pythons.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the requires-python floor; 3.15 is what the Docker image ships.
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Each job installs a different dependency set. A shared immutable key
      # lets the faster CSS job save its tiny cache before either test job.
      - name: Cache Python test dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.python.outputs.python-version }}-

      - name: Install (with dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src test

      - name: Ruff format check
        run: ruff format --check src test

      - name: mypy (strict)
        run: mypy

      - name: Tests
        env:
          PYTEST_ADDOPTS: "-q --junitxml=pytest-results.xml"
        run: make test

      - name: Upload Python test results and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14

  # The browser suite (test/e2e/), which `check` collects and skips: the only
  # layer that sees whether a click produced a request, where focus landed, or
  # what an HTMX poll did to the page around it. Its own job so a browser
  # failure reads as one, on one Python — the browser layer doesn't vary by
  # interpreter.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Keep this image and the Playwright pin in pyproject.toml in sync. Baking
    # browsers and OS libraries into the image avoids apt downloads on every run.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.0-noble@sha256:684df257a1fa0ef3fa288239819984008f560e8f8db5b635ee9e2a50cbcd2e23
      options: --ipc=host
    env:
      # GitHub mounts HOME with the runner's owner, while this image runs as
      # root. pip disables caching there; use a directory owned by root instead.
      PIP_CACHE_DIR: /root/.cache/pip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Build browser assets
        # The Playwright image has no Make; these are the browser-assets recipe.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.15"

      - name: Cache browser test dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.python.outputs.python-version }}-

      - name: Install (with dev + e2e extras)
        run: pip install -e ".[dev,e2e]"

      - name: Verify Playwright image compatibility
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          from pathlib import Path

          installed = importlib.metadata.version("playwright")
          image = json.loads(Path("/ms-playwright/.docker-info").read_text())
          assert installed == image["driverVersion"], (
              f"Playwright {installed} does not match CI image {image['driverVersion']}; "
              "update the pinned image in .github/workflows/ci.yml with pyproject.toml"
          )
          print(f"Playwright {installed}: using browsers and system libraries from the CI image")
          PY

      # `loadscope` keeps each module on one worker, so a module-scoped server
      # boots once. Report slow setup/call/teardown phases as well as retaining
      # full per-test timings, including on successful runs.
      - name: Browser tests
        env:
          RUN_E2E: "1"
          E2E_TRACE_DIR: test-results
        run: pytest test/e2e -q -rs -n 4 --dist loadscope --durations=30 --junitxml=e2e-results.xml

      - name: Upload browser test results and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e-results.xml
          if-no-files-found: ignore
          retention-days: 14

      # One Playwright trace per failing test: `playwright show-trace <zip>`
      # replays it with the DOM, screenshots and network at every step.
      - name: Upload traces of failing tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The committed CSS bundle must match what the templates need. Runs once
  # (no matrix) — Tailwind output is Python-version-independent.
  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install Tailwind wrapper
        run: pip install pytailwindcss

      - name: Rebuild CSS and check for drift
        run: |
          make css
          git diff --exit-code static/harmonist.css \
            || { echo "::error::static/harmonist.css is stale — run 'make css' and commit the result."; exit 1; }

  # History stays linear: a PR lands on main by fast-forward, so a merge commit
  # on the branch would land with it. The `linear-history` ruleset refuses one on
  # main itself; this says so on the PR, while the branch can still be rebased.
  linear:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The PR's own head, not the merge ref GitHub checks out by default,
      # which is itself a merge commit.
      - name: No merge commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          merges=$(git rev-list --merges "$BASE..$HEAD")
          for merge in $merges; do
            # The fork owner approved this one reconciliation of published
            # histories. Pin its object ID; every other merge stays forbidden.
            if [ "$GITHUB_REPOSITORY" = "ebrgr/harmonist" ] &&
               [ "$merge" = "b3fa706d8abe31c66111cc5cadf5dc118604ab39" ]; then
              echo "Approved fork synchronization merge: $merge"
              continue
            fi
            git show --no-patch --oneline "$merge"
            echo "::error::Merge commits are not allowed — rebase onto main instead."
            exit 1
          done
