<div id="release-revert-{{ album.id }}" hx-swap-oob="innerHTML">
    {% if previous_release %}
    <button type="button" hx-post="/library/{{ album.id }}/rematch/undo"
            hx-swap="none" hx-disabled-elt="this"
            class="px-3 py-1.5 bg-white hover:bg-surface text-ink border border-line rounded text-xs font-bold uppercase tracking-widest transition">Revert to Previous</button>
    {% endif %}
</div>
{% if siblings_error %}
<p role="alert" class="text-xs text-amber-700">{{ siblings_error }}</p>
{% if siblings_retryable %}
<button type="button" hx-get="/manual/{{ album.id }}/siblings?on_album_page={{ 'true' if on_album_page else 'false' }}&amp;reread=true"
        hx-target="closest [id^=release-siblings-]" hx-swap="innerHTML settle:0ms" hx-disabled-elt="this"
        class="px-3 py-1.5 bg-surface hover:bg-line text-ink border border-line rounded text-xs font-bold uppercase tracking-widest transition">Retry</button>
{% endif %}
{% elif results %}
{% with region_label="Releases in this release group" %}
{% include 'partials/manual_search_results.html' %}
{% endwith %}
{% endif %}
