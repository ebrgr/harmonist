{# A Library album whose update waits in the Inbox (#273). The heading of its
   group says how far the update reaches; the album page shows it and applies
   or ignores it. #}
<div id="task-{{ album.id }}" class="p-4 rounded-lg bg-white border border-mb-purple/40">
    {% include 'partials/_album_header.html' %}
    <a href="/album/{{ album.id }}#album-update-{{ album.id }}"
       class="inline-block px-3 py-1.5 border border-line text-ink hover:border-accent hover:bg-accent-soft rounded text-xs font-semibold transition">Review update</a>
</div>
